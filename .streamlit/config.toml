# VERITAS tasarım jetonları — Streamlit taban teması.
# Çalışma anındaki gündüz/gece geçişi veritas_theme.build_css() ile yapılır;
# buradaki değerler yalnızca ilk boyama ve Streamlit kendi bileşenleri içindir.

[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
